[project]
name = "vibeguard"
version = "0.1.0"
description = "Self-tightening harness that protects vibecoders' money and time. MongoDB Harness Engineering hackathon, SF Tech Week 2026."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
atlas = ["pymongo>=4.8,<5"]
voyage = ["voyageai>=0.5.0"]
memory = ["agent-engine-sdk-memory==0.10.0"]
api = ["fastapi>=0.143.0", "uvicorn>=0.30"]
dev = ["pytest>=9.1.1", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
