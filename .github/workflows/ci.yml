name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  LEFTHOOK: '0'
  VIBEGUARD_STORE: flat

jobs:
  web:
    name: Modelence lint, types, policy tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install pinned repository tools
        run: npm ci
      - name: Install Modelence dependencies
        run: npm ci --prefix web
      - name: Validate hook configuration
        run: npm run hooks:check
      - name: Check Biome baseline
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test policy behavior and runtime ownership
        run: npm test
      - name: Build production application (no runtime credentials)
        run: npm run build

  python:
    name: Harness and API tests without live services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install harness and optional API test dependencies
        run: python -m pip install -e '.[dev,api,atlas]'
      - name: Test frozen evals, review boundaries and memory policy
        run: python -m pytest -q
