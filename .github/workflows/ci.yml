name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  LEFTHOOK: '0'
  VIBEGUARD_STORE: flat

jobs:
  web:
    name: Modelence lint, types, policy tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install pinned repository tools
        run: npm ci
      - name: Install Modelence dependencies
        run: npm ci --prefix web
      - name: Validate hook configuration
        run: npm run hooks:check
      - name: Check Biome baseline
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test policy behavior and runtime ownership
        run: npm test
      - name: Build production application (no runtime credentials)
        run: npm run build

  python:
    name: Harness and API tests without live services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install harness and optional API test dependencies
        run: python -m pip install -e '.[dev,api,atlas]'
      - name: Test frozen evals, review boundaries and memory policy
        run: python -m pytest -q
