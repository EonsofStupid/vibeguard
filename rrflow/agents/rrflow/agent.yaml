# Human-readable app slug used by Agent Engine tooling.
# `agentengine create` should rewrite this when generating a new app from the template.
name: rrflow
# Node entry point for the SDK App instance.
# Format: <module path>:<export name>. This template exposes `app` from
# src/agent_rrflow/main.ts (compiled to dist/agent_rrflow/main.js).
entrypoint: agent_rrflow.main:app
framework: langgraph
# Programming language for this agent.
language: typescript
# Runtime feature flags controlled by agent.yaml, not .env.
#   memory:     long-term memory (semantic/episodic/taxonomic). VOYAGE_API_KEY must be in .env.
#               `agentengine create --memory` enables this and prompts for the Voyage key.
#   deep_agent: registers the tool sandbox's built-in filesystem + shell handlers that
#               deep agents rely on. Required for App.deepAgent().
features:
    memory: true
    deep_agent: false
    durable_workflow: true
# Tool placement and pass-through secrets. Interrupt tools must stay on the agent.
sandboxes:
    agent:
        secrets: ["MONGODB_URI"]
        tools:
            - human_review
    tool:
        secrets: []
        tools: []
version: 0.1.1
network:
    egress_mode: allow_all
